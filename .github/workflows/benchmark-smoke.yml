name: benchmark-smoke

# Runs the offline benchmark harness on synthetic data. No Azure credentials
# are required or used.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync
        run: uv sync --extra dev

      - name: Baseline benchmark (reproduces throttling)
        run: >
          uv run aiwoa benchmark run
          --scenario post-call-analytics
          --config workload-scenarios/post-call-analytics/benchmarks/baseline-batch.yaml

      - name: Token-optimization benchmark
        run: >
          uv run aiwoa benchmark run
          --scenario post-call-analytics
          --config workload-scenarios/post-call-analytics/benchmarks/token-optimization.yaml

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: workload-scenarios/post-call-analytics/reports/*.result.json
          if-no-files-found: ignore
