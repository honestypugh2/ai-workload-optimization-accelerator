[project]
name = "ai-workload-optimization-accelerator"
version = "0.1.0"
description = "Reusable accelerator for evaluating and optimizing Azure AI workloads across throughput, latency, token usage, cost, quality, reliability, and architecture patterns."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Azure AI Accelerators" }]
keywords = [
    "azure",
    "ai",
    "foundry",
    "benchmarking",
    "evaluation",
    "optimization",
    "llm",
]
dependencies = [
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "typer>=0.27",
    "rich>=15.0",
    "pypdf>=6.16",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Cloud adapters are optional. Local benchmark/evaluation must work without them.
# NOTE: the Foundry path uses Azure OpenAI via azure-ai-projects (AIProjectClient);
# the direct `openai` package is only used by the optional LiteLLM/APIM gateway
# adapter. openai is capped <3 for agent-framework compatibility, which in turn
# caps azure-ai-projects <2.5 (2.5.0 requires openai>=3).
foundry = [
    "azure-ai-projects>=2.4,<2.5",
    "azure-identity>=1.25",
    "openai>=2.8,<3",
]
# Clearly marked non-production / experimental integrations.
experimental = [
    "agent-framework>=1.15",
]
# Optional advanced chunking backends. The native chunkers work without these;
# when installed, `sentence` uses NLTK Punkt, `recursive` uses LangChain's
# RecursiveCharacterTextSplitter, and `semantic_embedding` uses sentence-transformers.
chunking = [
    "langchain-text-splitters>=0.3",
    "nltk>=3.9",
    "sentence-transformers>=3.0",
]
dev = [
    "ruff>=0.16",
    "pyright>=1.1.411",
    "pytest>=9.1",
    "pytest-cov>=7.1",
]

[project.scripts]
aiwoa = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/benchmarking",
    "src/evaluation",
    "src/optimization",
    "src/workloads",
    "src/foundry",
    "src/agents",
    "src/observability",
    "src/reporting",
    "src/storage",
    "src/registry",
    "src/shared",
    "src/cli",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = true
# The experimental agent-framework extra pulls hosting subdeps that upstream
# ships only as pre-releases; allow prereleases so it can resolve. Core/foundry
# pins stay stable because they are locked without --upgrade (openai is capped
# <3 and azure-ai-projects <2.5 for agent-framework compatibility).
prerelease = "allow"
