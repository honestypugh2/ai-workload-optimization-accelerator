# Current-state reproduction — full daily volume (7,000 transcripts).
#
# Models the customer's present-day batch: a SINGLE nano-class Standard
# deployment, full-transcript prompting on every task, no caching, retry-with-
# backoff on throttling. Reproduces the ~12-hour processing window and the 429
# throttling that drives the multi-day end-to-end lag.
#
# The tokens_per_minute_limit override represents the *observed effective*
# throughput of the single deployment during the batch window (calibrated so the
# 7,000-transcript batch completes in ~12h). The scenario's documented Standard
# quota (200k TPM) lives in scenario.yaml.
name: current-state-batch
description: Customer current-state — single deployment, full transcripts, no cache, 7,000/day.
scenario: post-call-analytics
execution_mode: local
strategy: baseline_full_transcript
routing: single_deployment
caching: []
use_optimized_mapping: false
transcript_count: 7000
deployment_overrides:
  deployment_count: 1
  tokens_per_minute_limit: 250000
  shared_quota: true
  retry_with_backoff: true
pricing_file: configs/pricing.example.yaml
seed: 1234
