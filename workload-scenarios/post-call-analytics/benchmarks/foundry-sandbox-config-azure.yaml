# High-quota baseline, re-pinned to THIS sandbox's real quota ceiling.
#
# Same shape as foundry-current-config-azure.yaml (single Global Standard nano,
# full-transcript prompting, no caching, retry with backoff, 7,000/day) but the
# TPM ceiling is dropped from the 25,000,000 high-quota tier to the default
# nano Global Standard quota available in this sandbox subscription/region.
#
# Verified live (az cognitiveservices usage list -l eastus):
#   * gpt-5.4-nano - GlobalStandard  ->  limit 5,000 units  = 5,000,000 TPM
#   * The 25,000-unit high-quota tier is 5x this default and requires a quota
#     increase; this config models what we can actually run here TODAY.
#
# A throttle-bound model would predict ~5x the high-quota run time here. The
# live 7,000-transcript run in this sandbox (24 workers) instead finished in
# ~2.5 h with zero HTTP 429s while using ~24% of the 5M TPM quota: throughput
# was bound by per-call latency x concurrency, not by the TPM ceiling. Token
# volume and price are unchanged, so cost/run and cost/month match the
# high-quota baseline.
name: foundry-sandbox-config-azure
description: Reference baseline re-pinned to this sandbox's real nano quota — single Global Standard, 5M TPM, 7,000/day.
scenario: post-call-analytics
execution_mode: azure
strategy: baseline_full_transcript
routing: single_deployment
caching: []
use_optimized_mapping: false
chunking: full
transcript_count: 7000
max_concurrency: 32
deployment_overrides:
  deployment_count: 1
  tokens_per_minute_limit: 5000000
  requests_per_minute_limit: 5000
  shared_quota: true
  retry_with_backoff: true
  ptu_units: 0
pricing_file: configs/pricing.example.yaml
seed: 1234
