# High-quota single-deployment baseline, reproduced on REAL Azure (7,000/day).
#
# Models a typical production-scale "before" state: one high-TPM Global Standard
# deployment serving the whole batch.
#   * Model class:     nano-class chat model
#   * Deployment type: Global Standard (pay-per-call, highest rate limits)
#   * Rate limit:      25,000,000 tokens/min  (RPM = 25,000) — illustrative high-quota tier
#   * Content filter:  Microsoft.DefaultV2
#   * Deployments:     1
#
# Full-transcript prompting, no caching, retry with backoff. It isolates what a
# single high-quota deployment achieves so it can be compared against the
# assessment's Option A/B/C.
#
# Live run (requires the 'foundry' extra and az login / managed identity):
#   FOUNDRY_PROJECT_ENDPOINT=<project-endpoint>
#   FOUNDRY_MODEL_NAME=<your Global Standard deployment name>
#   # leave AIWOA_GATEWAY_KIND unset/direct and FOUNDRY_USE_AGENT unset for
#   # direct model inference (recommended). Set FOUNDRY_USE_AGENT=1 to instead
#   # run the opt-in agent runtime against the same deployment.
name: foundry-current-config-azure
description: High-quota single-deployment baseline on real Azure — Global Standard, 25M TPM, 7,000/day.
scenario: post-call-analytics
execution_mode: azure
strategy: baseline_full_transcript
routing: single_deployment
caching: []
use_optimized_mapping: false
transcript_count: 7000
max_concurrency: 32
deployment_overrides:
  deployment_count: 1
  tokens_per_minute_limit: 25000000
  requests_per_minute_limit: 25000
  shared_quota: true
  retry_with_backoff: true
  ptu_units: 0
pricing_file: configs/pricing.example.yaml
seed: 1234
